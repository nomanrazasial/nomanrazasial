name: Refresh research and SAF watch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh research and SAF watch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202604' }}
        run: python scripts/sync.py

      - name: Check website files
        run: |
          python scripts/validate.py
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/research.json dist/data/snapshot.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh research and SAF source snapshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: refresh

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
